name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Core carries the policy and the audio maths, and has no dependency on Qualcomm hardware or
  # Windows. Testing it on Linux keeps the feedback loop fast and proves the split is real.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build core and ONNX layer
        run: |
          dotnet build src/LocalScribe.Core/LocalScribe.Core.csproj -c Release
          dotnet build src/LocalScribe.Onnx/LocalScribe.Onnx.csproj -c Release

      - name: Test
        run: dotnet test tests/LocalScribe.Core.Tests/LocalScribe.Core.Tests.csproj -c Release

  # The WinUI app only builds on Windows. There is no arm64 hosted runner, so this is a
  # cross-compile: it proves the app compiles, and produces a build to run by hand, but nothing
  # here executes it.
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Self-contained on both counts — the .NET runtime and the Windows App SDK travel with the
      # app — so testing it needs nothing installed on the target machine beyond the Hexagon
      # driver, which no build can carry.
      - name: Publish the app for win-arm64
        run: >
          dotnet publish src/LocalScribe.App/LocalScribe.App.csproj
          -c Release -r win-arm64 --self-contained true
          -o publish/win-arm64

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: localscribe-win-arm64
          path: publish/win-arm64
          retention-days: 30
